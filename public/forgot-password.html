<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reset password — Lumen</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/tokens.css?v20260820a">
<link rel="stylesheet" href="assets/css/base.css?v20260820a">
<link rel="stylesheet" href="assets/css/components.css?v20260820a">
<link rel="stylesheet" href="assets/css/pages.css?v20260820a">
</head>
<body>
<div class="auth-shell">
  <div class="auth-visual">
    <div class="spatial-screen" style="width:min(80%,340px);">
      <div class="spatial-screen-panel">
        <div class="spatial-screen-canvas">
          <span class="spatial-screen-live"><span class="dot"></span> LIVE</span>
          <div class="spatial-screen-adname">Account recovery</div>
        </div>
      </div>
      <div class="spatial-screen-shadow"></div>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <a class="brand" href="index.html"><span class="brand-mark"></span> Lumen</a>

      <div id="step-email">
        <h1 class="auth-title">Forgot password</h1>
        <p class="auth-sub">Enter the email linked to your account</p>
        <form id="find-account-form" novalidate>
          <div class="field">
            <label for="reset-email">Email</label>
            <input type="email" id="reset-email" placeholder="you@business.com" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block mt-6">Continue</button>
        </form>
      </div>

      <div id="step-reset" style="display:none;">
        <h1 class="auth-title">Set new password</h1>
        <p class="auth-sub">Choose a new password for your account</p>
        <form id="reset-password-form" novalidate>
          <div class="field">
            <label for="new-password">New password</label>
            <input type="password" id="new-password" placeholder="At least 6 characters" required>
          </div>
          <div class="field mt-4">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block mt-6">Reset Password</button>
        </form>
      </div>

      <div class="auth-footer">Remembered your password? <a href="login.html">Log in</a></div>
    </div>
  </div>
</div>

<script type="module" src="assets/js/pages/forgot-password.js?v20260820a"></script>
</body>
</html>
